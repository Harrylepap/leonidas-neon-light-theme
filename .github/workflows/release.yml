# Publication sur le JetBrains Marketplace quand une release GitHub est publiée.
# Secrets requis : PUBLISH_TOKEN (+ CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD pour la signature).
# Rappel : la TOUTE PREMIÈRE version doit être déposée à la main sur plugins.jetbrains.com.
name: Release

on:
  release:
    types: [ prereleased, released ]

jobs:
  release:
    name: Publish Plugin
    # v1.0.0 a été déposée à la main sur le Marketplace : ne pas la republier
    if: github.event.release.tag_name != 'v1.0.0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Publish Plugin
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin

      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} ./build/distributions/*
