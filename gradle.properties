# ─────────────────────────────────────────────────────────────────────────────
# Leonidas - Neon Light : configuration du plugin
# Les valeurs TODO_* sont à remplir avant toute publication sur le Marketplace
# (la tâche publishPlugin refuse de partir tant qu'il en reste une).
# ─────────────────────────────────────────────────────────────────────────────

# Identifiant DÉFINITIF du plugin sur le Marketplace (ne peut plus changer ensuite)
# ex. io.github.monpseudo.leonidas-neon-light
pluginId = io.github.harrylepap.leonidas-neon-light
# Groupe Maven/Gradle, en général le préfixe de l'id (ex. io.github.monpseudo)
pluginGroup = io.github.harrylepap
pluginName = Leonidas - Neon Light
pluginVersion = 1.0.0

# Vendeur affiché sur la page du plugin
vendorName = Bako Harry Rakotondratompo
vendorEmail = rakotondratompobakoharry@yahoo.fr
vendorUrl = https://github.com/harrylepap

# Dépôt public (GitHub), affiché comme « Source code » sur le Marketplace
pluginRepositoryUrl = https://github.com/harrylepap/leonidas-neon-light-theme

# Compatibilité : Islands Dark (thème parent) existe à partir de 2025.3 (build 253)
pluginSinceBuild = 253
# Laisser vide = compatible avec toutes les versions futures
pluginUntilBuild =

# IDE utilisé pour compiler et lancer runIde
platformVersion = 2026.2.3
# Optionnel : chemin d'un IntelliJ installé pour éviter le téléchargement (build local)
# ex. -PplatformLocalPath="C:/Program Files/JetBrains/IntelliJ IDEA 2025.2.4"
platformLocalPath =

org.gradle.configuration-cache = true
org.gradle.caching = true
